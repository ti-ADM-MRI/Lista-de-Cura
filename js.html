<script>
  var nameCount = 0;
  var currentShabatDate = '';
  var isFormOpen = false;
  
  document.addEventListener('DOMContentLoaded', function() {
    google.script.run
      .withSuccessHandler(function(status) {
        currentShabatDate = status.shabatDate;
        isFormOpen = status.isOpen;
        document.getElementById('shabatDate').textContent = status.shabatDate;
        document.getElementById('currentTime').textContent = status.currentTime;
        
        if (status.showWarning) {
          document.getElementById('warningMessage').textContent = status.message;
          document.getElementById('warningBox').style.display = 'block';
          document.getElementById('formContainer').style.display = 'none';
        } else {
          document.getElementById('warningBox').style.display = 'none';
          document.getElementById('formContainer').style.display = 'block';
          for (var i = 0; i < 6; i++) addNameField();
        }
      })
      .withFailureHandler(function(error) {
        currentShabatDate = '05/09/2026';
        document.getElementById('shabatDate').textContent = currentShabatDate;
        document.getElementById('formContainer').style.display = 'block';
        for (var i = 0; i < 6; i++) addNameField();
      })
      .checkFormStatus();
  });
  
  function addNameField() {
    nameCount++;
    var container = document.getElementById('namesContainer');
    if (!container) return;
    
    var div = document.createElement('div');
    div.className = 'name-field';
    div.id = 'nameField_' + nameCount;
    
    var label = document.createElement('label');
    label.textContent = 'Nome Completo';
    
    var input = document.createElement('input');
    input.type = 'text';
    input.id = 'name_' + nameCount;
    input.className = 'name-input';
    input.placeholder = 'Digite o nome completo';
    
    var removeBtn = document.createElement('button');
    removeBtn.type = 'button';
    removeBtn.className = 'btn-remove';
    removeBtn.textContent = '(-)';
    removeBtn.onclick = function() { removeNameField(div); };
    
    div.appendChild(label);
    div.appendChild(input);
    div.appendChild(removeBtn);
    container.appendChild(div);
  }
  
  function removeNameField(element) {
    var fields = document.querySelectorAll('.name-field');
    if (fields.length > 1) {
      element.remove();
    } else {
      alert('É necessário manter pelo menos um campo de nome.');
    }
  }
  
  function clearForm() {
    var inputs = document.querySelectorAll('.name-input');
    inputs.forEach(function(input) { input.value = ''; });
    
    var fields = document.querySelectorAll('.name-field');
    while (fields.length > 6) {
      fields[fields.length - 1].remove();
      fields = document.querySelectorAll('.name-field');
    }
    document.getElementById('results').style.display = 'none';
  }
  
  function submitForm() {
    if (!isFormOpen) {
      showMessage('Formulário está fechado no momento.', 'error');
      return;
    }
    
    var inputs = document.querySelectorAll('.name-input');
    var names = [];
    inputs.forEach(function(input) {
      if (input.value.trim() !== '') names.push(input.value.trim());
    });
    
    if (names.length === 0) {
      showMessage('Por favor, preencha pelo menos um nome.', 'error');
      return;
    }
    
    showMessage('Processando...', 'info');
    
    google.script.run
      .withSuccessHandler(function(response) {
        if (response.success) {
          var msg = response.spreadsheet.message;
          showMessage(msg, 'success');
          document.getElementById('spreadsheetLink').href = response.spreadsheet.spreadsheetUrl;
          document.getElementById('presentationLink').href = response.presentation.presentationUrl;
          document.getElementById('results').style.display = 'block';
          setTimeout(function() { clearForm(); }, 2000);
        } else {
          showMessage('Erro: ' + response.error, 'error');
        }
      })
      .withFailureHandler(function(error) {
        showMessage('Erro ao processar: ' + error.message, 'error');
      })
      .processForm(names, currentShabatDate);
  }
  
  function showMessage(text, type) {
    var messageDiv = document.getElementById('message');
    if (messageDiv) {
      messageDiv.textContent = text;
      messageDiv.className = 'message ' + type;
      setTimeout(function() {
        messageDiv.textContent = '';
        messageDiv.className = 'message';
      }, 5000);
    }
  }

  // === FUNÇÕES DO PAINEL DEV ===
  function toggleDevPanel() {
    var panel = document.getElementById('devPanel');
    if (panel.style.display === 'none' || panel.style.display === '') {
      loadDevStats();
      panel.style.display = 'block';
    } else {
      panel.style.display = 'none';
    }
  }

  function closeDevPanel() {
    document.getElementById('devPanel').style.display = 'none';
  }

  function loadDevStats() {
    document.getElementById('devStats').innerHTML = '<p style="color: #856404;">Carregando...</p>';
    
    google.script.run
      .withSuccessHandler(function(stats) {
        if (!stats) {
          document.getElementById('devStats').innerHTML = '<p style="color: red;">Erro: resposta nula</p>';
          return;
        }
        
        if (stats.success) {
          var html = '<p style="margin: 5px 0;"><strong>Planilha:</strong> ' + (stats.spreadsheetName || 'N/A') + '</p>';
          html += '<p style="margin: 5px 0;"><strong>Nomes:</strong> ' + stats.totalNames + '</p>';
          html += '<p style="margin: 5px 0;"><strong>Slides:</strong> ' + stats.totalSlides + '</p>';
          html += '<p style="margin: 5px 0;"><strong>Atualizado:</strong> ' + stats.lastModified + '</p>';
          document.getElementById('devStats').innerHTML = html;
        } else {
          if (stats.notCreated) {
            document.getElementById('devStats').innerHTML = '<p style="color: #856404; background: #fff3cd; padding: 10px; border-radius: 5px;">️ ' + stats.error + '</p>';
          } else {
            document.getElementById('devStats').innerHTML = '<p style="color: red;">Erro: ' + stats.error + '</p>';
          }
        }
      })
      .withFailureHandler(function(error) {
        document.getElementById('devStats').innerHTML = '<p style="color: red;">Erro de conexão: ' + error.message + '</p>';
      })
      .getDeveloperStats(currentShabatDate);
  }

function downloadSpreadsheet() {
  showDevMessage('Abrindo planilha...', 'info');
  google.script.run
    .withSuccessHandler(function(stats) {
      if (stats && stats.success) {
        // Abre a planilha em nova aba (usuário faz download manualmente)
        window.open(stats.spreadsheetUrl, '_blank');
        showDevMessage('Planilha aberta! Use Arquivo → Download → Excel', 'success');
      } else {
        showDevMessage('Erro: ' + (stats ? stats.error : 'Resposta nula'), 'error');
      }
    })
    .withFailureHandler(function(error) {
      showDevMessage('Erro: ' + error.message, 'error');
    })
    .getDeveloperStats(currentShabatDate);
}

function regenerateSlides() {
  showDevMessage('Gerando slides...', 'info');
  
  google.script.run
    .withSuccessHandler(function(response) {
      console.log('Resposta regenerateSlides:', response);
      if (response.success) {
        // Abre o download automático do PPTX
        var pptxUrl = 'https://docs.google.com/presentation/d/' + response.presentationId + '/export/pptx';
        
        // Cria um link temporário para forçar o download
        var a = document.createElement('a');
        a.href = pptxUrl;
        a.download = 'Pedidos_de_Cura_Shabat_' + currentShabatDate.replace(/\//g, '-') + '.pptx';
        a.target = '_blank';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        
        // Também atualiza o link na tela principal
        document.getElementById('presentationLink').href = response.presentationUrl;
        
        showDevMessage('✅ Slides gerados e PPTX baixado!', 'success');
      } else {
        showDevMessage('❌ Erro: ' + response.error, 'error');
      }
    })
    .withFailureHandler(function(error) {
      console.error('Erro na chamada regenerateSlides:', error);
      showDevMessage('❌ Erro de conexão: ' + error.message, 'error');
    })
    .regenerateSlidesForDev(currentShabatDate);
}

  function exportNamesJSON() {
    showDevMessage('Exportando...', 'info');
    google.script.run
      .withSuccessHandler(function(data) {
        if (data.success === false) {
          showDevMessage('Erro: ' + data.error, 'error');
          return;
        }
        
        var jsonStr = JSON.stringify(data, null, 2);
        var blob = new Blob([jsonStr], { type: 'application/json' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'pedidos_' + (data.spreadsheetName || 'cura').replace(/[^a-z0-9]/gi, '_') + '.json';
        a.click();
        URL.revokeObjectURL(url);
        showDevMessage('Exportado! ' + data.totalNomes + ' nomes', 'success');
      })
      .withFailureHandler(function(error) {
        showDevMessage('Erro: ' + error.message, 'error');
      })
      .exportNamesAsJSON(currentShabatDate);
  }

  function showDevMessage(text, type) {
    var msgDiv = document.getElementById('devMessage');
    msgDiv.textContent = text;
    msgDiv.style.display = 'block';
    msgDiv.style.background = type === 'success' ? '#d4edda' : type === 'error' ? '#f8d7da' : '#d1ecf1';
    msgDiv.style.color = type === 'success' ? '#155724' : type === 'error' ? '#721c24' : '#0c5460';
    setTimeout(function() { msgDiv.style.display = 'none'; }, 5000);
  }

function generateDocx() {
  showDevMessage('Gerando documento Word...', 'info');
  
  google.script.run
    .withSuccessHandler(function(data) {
      if (data.success === false) {
        showDevMessage('Erro: ' + data.error, 'error');
        return;
      }
      
      // Cria HTML formatado para Word
      var html = generateWordHtml(data);
      
      // Converte HTML para Blob e faz download
      var blob = new Blob(['\ufeff', html], { type: 'application/msword' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'Pedidos_de_Cura_Shabat_' + currentShabatDate.replace(/\//g, '-') + '.doc';
      a.click();
      URL.revokeObjectURL(url);
      
      showDevMessage('✅ Documento Word gerado! ' + data.totalNomes + ' nomes', 'success');
    })
    .withFailureHandler(function(error) {
      showDevMessage('Erro: ' + error.message, 'error');
    })
    .exportNamesAsJSON(currentShabatDate);
}

function generateWordHtml(data) {
  var nomes = data.nomes;
  var shabatDate = data.shabatDate;
  
  // Organiza nomes em colunas (4 colunas × 32 nomes = 128 por página)
  var nomesPorPagina = 128;
  var nomesPorColuna = 32;
  var numColunas = 4;
  var totalPaginas = Math.ceil(nomes.length / nomesPorPagina);
  
  var html = `
    <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
    <head>
      <meta charset='utf-8'>
      <title>Pedidos de Cura - Shabat ${shabatDate}</title>
      <style>
        @page {
          size: A4 landscape;
          margin: 2cm;
        }
        body {
          font-family: 'Trebuchet MS', Arial, sans-serif;
          font-size: 10pt;
          color: #555555;
        }
        .titulo {
          font-size: 18pt;
          font-weight: bold;
          color: #1a73e8;
          text-align: center;
          margin-bottom: 20pt;
          font-family: 'Trebuchet MS', Arial, sans-serif;
        }
        .pagina {
          page-break-after: always;
          margin-bottom: 30pt;
        }
        .pagina:last-child {
          page-break-after: auto;
        }
        .tabela-nomes {
          width: 100%;
          border-collapse: collapse;
        }
        .tabela-nomes td {
          vertical-align: top;
          padding: 2pt 5pt;
          width: 25%;
          font-family: 'Trebuchet MS', Arial, sans-serif;
          font-size: 10pt;
          color: #555555;
        }
        .nome {
          margin: 3pt 0;
          line-height: 1.2;
        }
        .footer {
          text-align: center;
          font-style: italic;
          font-size: 9pt;
          color: #666666;
          margin-top: 30pt;
          font-family: 'Trebuchet MS', Arial, sans-serif;
        }
      </style>
    </head>
    <body>
  `;
  
  // Gera páginas
  for (var pagina = 0; pagina < totalPaginas; pagina++) {
    var startIndex = pagina * nomesPorPagina;
    var endIndex = Math.min(startIndex + nomesPorPagina, nomes.length);
    var nomesPagina = nomes.slice(startIndex, endIndex);
    
    html += '<div class="pagina">';
    html += '<div class="titulo">Pedidos de Cura - Shabat ' + shabatDate + '</div>';
    html += '<table class="tabela-nomes"><tr>';
    
    // Cria 4 colunas
    for (var col = 0; col < numColunas; col++) {
      html += '<td>';
      
      // Pega nomes desta coluna
      for (var row = 0; row < nomesPorColuna; row++) {
        var nameIndex = (row * numColunas) + col;
        if (nameIndex < nomesPagina.length) {
          html += '<div class="nome">' + nomesPagina[nameIndex].nome + '</div>';
        }
      }
      
      html += '</td>';
    }
    
    html += '</tr></table>';
    
    // Footer apenas na última página
    if (pagina === totalPaginas - 1) {
      html += '<div class="footer">...e o Ponto de Estudos da Torah no Brasil e no Mundo.</div>';
    }
    
    html += '</div>';
  }
  
  html += '</body></html>';
  
  return html;
}

function generateProjectDoc() {
  showDevMessage('Gerando documentação do projeto...', 'info');
  
  var html = generateProjectDocumentationHtml();
  
  // Cria Blob e faz download
  var blob = new Blob(['\ufeff', html], { type: 'application/msword' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'Projeto_Pedidos_de_Cura_Documentacao.doc';
  a.click();
  URL.revokeObjectURL(url);
  
  showDevMessage('✅ Documentação gerada com sucesso!', 'success');
}
