<script>
  // Garante compatibilidade caso o código seja executado fora do Google Apps Script (ex: preview do navegador)
  if (typeof google === 'undefined' || !google.script) {
    window.google = {
      script: {
        run: {
          withSuccessHandler: function(onSuccess) {
            this._onSuccess = onSuccess;
            return this;
          },
          withFailureHandler: function(onFailure) {
            this._onFailure = onFailure;
            return this;
          },
          checkFormStatus: function() {
            var handler = this._onSuccess;
            setTimeout(function() {
              if (handler) {
                handler({
                  isOpen: true,
                  shabatDate: '12/09/2026',
                  currentTime: new Date().toLocaleString('pt-BR'),
                  isDeveloper: true,
                  showWarning: false,
                  message: 'Ambiente de visualização ativo'
                });
              }
            }, 300);
          },
          processForm: function(names, shabatDate) {
            var handler = this._onSuccess;
            setTimeout(function() {
              if (handler) {
                handler({
                  success: true,
                  spreadsheet: {
                    newNames: names.length,
                    duplicates: 0,
                    message: '- ' + names.length + ' nome(s) adicionado(s)!'
                  }
                });
              }
            }, 500);
          },
          getDeveloperStats: function(shabatDate) {
            var handler = this._onSuccess;
            setTimeout(function() {
              if (handler) {
                handler({
                  success: true,
                  spreadsheetName: 'Pedidos de Cura - Shabat ' + (shabatDate || '12/09/2026'),
                  totalNames: 32,
                  totalSlides: 1,
                  lastModified: new Date().toLocaleString('pt-BR'),
                  spreadsheetUrl: '#'
                });
              }
            }, 300);
          },
          regenerateSlidesForDev: function(shabatDate) {
            var handler = this._onSuccess;
            setTimeout(function() {
              if (handler) {
                handler({
                  success: true,
                  presentationId: 'dummy_id',
                  presentationUrl: '#'
                });
              }
            }, 500);
          },
          exportNamesAsJSON: function(shabatDate) {
            var handler = this._onSuccess;
            setTimeout(function() {
              if (handler) {
                handler({
                  success: true,
                  shabatDate: shabatDate || '12/09/2026',
                  spreadsheetName: 'Pedidos de Cura',
                  totalNomes: 2,
                  nomes: [{ nome: 'Nome Demonstrativo 1' }, { nome: 'Nome Demonstrativo 2' }]
                });
              }
            }, 300);
          },
          getProjectDocumentationHtml: function() {
            var handler = this._onSuccess;
            setTimeout(function() {
              if (handler) {
                handler('<html><body><h1>Documentação Carregada via Servidor</h1></body></html>');
              }
            }, 300);
          }
        }
      }
    };
  }

  var nameCount = 0;
  var currentShabatDate = '';
  var isFormOpen = false;
  var messageTimeout = null;
  var devMessageTimeout = null;
  
  document.addEventListener('DOMContentLoaded', function() {
    // Garante container de visualização caso o arquivo seja aberto isoladamente no preview
    if (!document.getElementById('formContainer') && !document.getElementById('namesContainer')) {
      var previewWrapper = document.createElement('div');
      previewWrapper.innerHTML = `
        <div style="max-width:600px;margin:20px auto;font-family:sans-serif;padding:20px;border:1px solid #e0e0e0;border-radius:8px;">
          <h2 style="color:#1a73e8;margin-top:0;">Pedidos de Cura - Shabat <span id="shabatDate">...</span></h2>
          <div id="currentTime" style="color:#666;font-size:12px;margin-bottom:12px;"></div>
          <div id="warningBox" style="display:none;background:#fff3cd;padding:10px;border-radius:4px;color:#856404;margin-bottom:12px;">
            <p id="warningMessage" style="margin:0;"></p>
          </div>
          <div id="formContainer" style="display:none;">
            <div id="namesContainer"></div>
            <div style="margin-top:15px;display:flex;gap:10px;">
              <button type="button" onclick="addNameField()" style="background:#28a745;color:white;border:none;padding:10px 16px;border-radius:4px;cursor:pointer;">(+) Adicionar Nome</button>
              <button type="button" onclick="submitForm()" style="background:#1a73e8;color:white;border:none;padding:10px 16px;border-radius:4px;cursor:pointer;">Enviar</button>
            </div>
            <div id="message" style="margin-top:12px;"></div>
          </div>
        </div>
      `;
      document.body.appendChild(previewWrapper);
    }

    // === CARREGAMENTO DO FORMULÁRIO COM PROTEÇÃO CONTRA ELEMENTOS NULOS ===
    google.script.run
      .withSuccessHandler(function(status) {
        currentShabatDate = status.shabatDate;
        isFormOpen = status.isOpen;

        var shabatElem = document.getElementById('shabatDate');
        if (shabatElem) shabatElem.textContent = status.shabatDate;

        var timeElem = document.getElementById('currentTime');
        if (timeElem) timeElem.textContent = status.currentTime;
        
        var devBtn = document.getElementById('devButton');
        if (devBtn && status.isDeveloper) {
          devBtn.style.display = 'block';
        }
        
        var warnBox = document.getElementById('warningBox');
        var warnMsg = document.getElementById('warningMessage');
        var formCont = document.getElementById('formContainer');

        if (status.showWarning) {
          if (warnMsg) warnMsg.textContent = status.message;
          if (warnBox) warnBox.style.display = 'block';
          if (formCont) formCont.style.display = 'none';
        } else {
          if (warnBox) warnBox.style.display = 'none';
          if (formCont) formCont.style.display = 'block';
          for (var i = 0; i < 6; i++) addNameField();
        }
      })
      .withFailureHandler(function(error) {
        currentShabatDate = '05/09/2026';
        var shabatElem = document.getElementById('shabatDate');
        if (shabatElem) shabatElem.textContent = currentShabatDate;

        var formCont = document.getElementById('formContainer');
        if (formCont) formCont.style.display = 'block';

        for (var i = 0; i < 6; i++) addNameField();
      })
      .checkFormStatus();
  });
  
  function addNameField() {
    nameCount++;
    var container = document.getElementById('namesContainer');
    if (!container) return;
    var div = document.createElement('div');
    div.className = 'name-field';
    div.id = 'nameField_' + nameCount;
    var label = document.createElement('label');
    label.textContent = 'Nome Completo';
    var input = document.createElement('input');
    input.type = 'text';
    input.id = 'name_' + nameCount;
    input.className = 'name-input';
    input.placeholder = 'Digite o nome completo';
    var removeBtn = document.createElement('button');
    removeBtn.type = 'button';
    removeBtn.className = 'btn-remove';
    removeBtn.textContent = '(-)';
    removeBtn.onclick = function() { removeNameField(div); };
    div.appendChild(label);
    div.appendChild(input);
    div.appendChild(removeBtn);
    container.appendChild(div);
  }
  
  function removeNameField(element) {
    var fields = document.querySelectorAll('.name-field');
    if (fields.length > 1) {
      element.remove();
    } else {
      showMessage('É necessário manter pelo menos um campo de nome.', 'error', 6000);
    }
  }
  
  function clearForm() {
    var container = document.getElementById('namesContainer');
    if (!container) return;
    
    // Reseta o container e o contador de nomes
    container.innerHTML = '';
    nameCount = 0;
    
    // Recria os 6 campos em branco do padrão inicial
    for (var i = 0; i < 6; i++) {
      addNameField();
    }
  }
  
  function submitForm() {
    if (!isFormOpen) {
      showMessage('Formulário está fechado no momento.', 'error', 10000);
      return;
    }
    var inputs = document.querySelectorAll('.name-input');
    var names = [];
    inputs.forEach(function(input) {
      if (input.value.trim() !== '') names.push(input.value.trim());
    });
    if (names.length === 0) {
      showMessage('Por favor, preencha pelo menos um nome.', 'error', 10000);
      return;
    }
    
    showMessage('Processando...', 'info');
    
    google.script.run
      .withSuccessHandler(function(response) {
        if (response.success) {
          // Monta mensagens amigáveis com quebra de linha quando houver novos e duplicados
          var newCount = response.spreadsheet.newNames || 0;
          var dupCount = response.spreadsheet.duplicates || 0;
          var finalMsg = '';
          var msgType = 'success';

          if (newCount > 0 && dupCount > 0) {
            // Caso misto: nomes novos adicionados e duplicados ignorados
            finalMsg = '• ' + newCount + ' nome(s) adicionado(s) com sucesso!<br>• Houve(ram) ' + dupCount + ' duplicado(s) que já está gravado.';
            msgType = 'success';
          } else if (newCount > 0 && dupCount === 0) {
            // Apenas novos nomes
            finalMsg = '• ' + newCount + ' nome(s) adicionado(s) com sucesso!';
            msgType = 'success';
          } else if (newCount === 0 && dupCount > 0) {
            // Apenas duplicados
            finalMsg = '• Nenhum nome novo adicionado.<br>• Houve(ram) ' + dupCount + ' duplicado(s) que já está gravado.';
            msgType = 'info';
          } else {
            finalMsg = response.spreadsheet.message || 'Pedidos processados com sucesso!';
          }

          // Exibe a mensagem por 15 segundos
          showMessage(finalMsg, msgType, 15000);
          
          // Limpa os campos para nova digitação
          clearForm();
        } else {
          showMessage('Erro: ' + response.error, 'error', 12000);
        }
      })
      .withFailureHandler(function(error) {
        showMessage('Erro ao processar: ' + error.message, 'error', 12000);
      })
      .processForm(names, currentShabatDate);
  }
  
  function showMessage(text, type, customDuration) {
    var messageDiv = document.getElementById('message');
    if (!messageDiv) return;

    // Cancela qualquer timer anterior para não apagar a nova mensagem antes da hora
    if (messageTimeout) {
      clearTimeout(messageTimeout);
      messageTimeout = null;
    }

    // Suporta quebras de linha e tags HTML para mensagens duplas
    messageDiv.innerHTML = text;
    messageDiv.className = 'message ' + type;

    // Mensagens de "Processando..." não se fecham sozinhas; aguardam o retorno do servidor
    if (type === 'info' && text === 'Processando...') return;

    // Duração padrão estendida: 12 segundos (ou customDuration se fornecido)
    var duration = customDuration || 12000;
    
    messageTimeout = setTimeout(function() {
      messageDiv.innerHTML = '';
      messageDiv.className = 'message';
    }, duration);
  }

  function toggleDevPanel() {
    var panel = document.getElementById('devPanel');
    if (panel.style.display === 'none' || panel.style.display === '') {
      loadDevStats();
      panel.style.display = 'block';
    } else {
      panel.style.display = 'none';
    }
  }

  function loadDevStats() {
    document.getElementById('devStats').innerHTML = '<p style="color: #856404;">Carregando...</p>';
    google.script.run
      .withSuccessHandler(function(stats) {
        if (!stats) {
          document.getElementById('devStats').innerHTML = '<p style="color: red;">Erro: resposta nula</p>';
          return;
        }
        if (stats.success) {
          var html = '<p style="margin: 5px 0;"><strong>Planilha:</strong> ' + (stats.spreadsheetName || 'N/A') + '</p>';
          html += '<p style="margin: 5px 0;"><strong>Nomes:</strong> ' + stats.totalNames + '</p>';
          html += '<p style="margin: 5px 0;"><strong>Slides:</strong> ' + stats.totalSlides + '</p>';
          html += '<p style="margin: 5px 0;"><strong>Atualizado:</strong> ' + stats.lastModified + '</p>';
          document.getElementById('devStats').innerHTML = html;
        } else {
          document.getElementById('devStats').innerHTML = '<p style="color: red;">Erro: ' + stats.error + '</p>';
        }
      })
      .withFailureHandler(function(error) {
        document.getElementById('devStats').innerHTML = '<p style="color: red;">Erro de conexão: ' + error.message + '</p>';
      })
      .getDeveloperStats(currentShabatDate);
  }

  function downloadSpreadsheet() {
    showDevMessage('Abrindo planilha...', 'info');
    google.script.run
      .withSuccessHandler(function(stats) {
        if (stats && stats.success) {
          window.open(stats.spreadsheetUrl, '_blank');
          showDevMessage('Planilha aberta! Use Arquivo → Download → Excel', 'success', 10000);
        } else {
          showDevMessage('Erro: ' + (stats ? stats.error : 'Resposta nula'), 'error', 10000);
        }
      })
      .withFailureHandler(function(error) {
        showDevMessage('Erro: ' + error.message, 'error', 10000);
      })
      .getDeveloperStats(currentShabatDate);
  }

  function regenerateSlides() {
    showDevMessage('Gerando slides...', 'info');
    google.script.run
      .withSuccessHandler(function(response) {
        if (response.success) {
          var pptxUrl = 'https://docs.google.com/presentation/d/' + response.presentationId + '/export/pptx';
          var a = document.createElement('a');
          a.href = pptxUrl;
          a.download = 'Pedidos_de_Cura_Shabat_' + currentShabatDate.replace(/\//g, '-') + '.pptx';
          a.target = '_blank';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);

          var presLink = document.getElementById('presentationLink');
          if (presLink) presLink.href = response.presentationUrl;

          showDevMessage('✅ Slides gerados e PPTX baixado!', 'success', 12000);
        } else {
          showDevMessage('❌ Erro: ' + response.error, 'error', 12000);
        }
      })
      .withFailureHandler(function(error) {
        showDevMessage('❌ Erro de conexão: ' + error.message, 'error', 12000);
      })
      .regenerateSlidesForDev(currentShabatDate);
  }

  function exportNamesJSON() {
    showDevMessage('Exportando...', 'info');
    google.script.run
      .withSuccessHandler(function(data) {
        if (data.success === false) {
          showDevMessage('Erro: ' + data.error, 'error', 12000);
          return;
        }
        var jsonStr = JSON.stringify(data, null, 2);
        var blob = new Blob([jsonStr], { type: 'application/json' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'pedidos_' + (data.spreadsheetName || 'cura').replace(/[^a-z0-9]/gi, '_') + '.json';
        a.click();
        URL.revokeObjectURL(url);
        showDevMessage('Exportado! ' + data.totalNomes + ' nomes', 'success', 10000);
      })
      .withFailureHandler(function(error) {
        showDevMessage('Erro: ' + error.message, 'error', 12000);
      })
      .exportNamesAsJSON(currentShabatDate);
  }

  function showDevMessage(text, type, customDuration) {
    var msgDiv = document.getElementById('devMessage');
    if (!msgDiv) return;

    if (devMessageTimeout) {
      clearTimeout(devMessageTimeout);
      devMessageTimeout = null;
    }

    msgDiv.textContent = text;
    msgDiv.style.display = 'block';
    msgDiv.style.background = type === 'success' ? '#d4edda' : type === 'error' ? '#f8d7da' : '#d1ecf1';
    msgDiv.style.color = type === 'success' ? '#155724' : type === 'error' ? '#721c24' : '#0c5460';
    
    if (type === 'info') return;

    var duration = customDuration || 10000;
    devMessageTimeout = setTimeout(function() { 
      msgDiv.style.display = 'none'; 
    }, duration);
  }

  function generateDocx() {
    showDevMessage('Gerando documento Word...', 'info');
    google.script.run
      .withSuccessHandler(function(data) {
        if (data.success === false) {
          showDevMessage('Erro: ' + data.error, 'error', 12000);
          return;
        }
        var html = generateWordHtml(data);
        var blob = new Blob(['\ufeff', html], { type: 'application/msword' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'Pedidos_de_Cura_Shabat_' + currentShabatDate.replace(/\//g, '-') + '.doc';
        a.click();
        URL.revokeObjectURL(url);
        showDevMessage('✅ Documento Word gerado! ' + data.totalNomes + ' nomes', 'success', 12000);
      })
      .withFailureHandler(function(error) {
        showDevMessage('Erro: ' + error.message, 'error', 12000);
      })
      .exportNamesAsJSON(currentShabatDate);
  }

  function generateWordHtml(data) {
    var nomes = data.nomes;
    var shabatDate = data.shabatDate || currentShabatDate || '';
    var nomesPorPagina = 128;
    var nomesPorColuna = 32;
    var numColunas = 4;
    var totalPaginas = Math.ceil(nomes.length / nomesPorPagina);
    var html = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
    <head><meta charset='utf-8'><title>Pedidos de Cura - Shabat ${shabatDate}</title>
    <style>@page { size: A4 landscape; margin: 2cm; } body { font-family: 'Trebuchet MS', Arial, sans-serif; font-size: 10pt; color: #555555; } .titulo { font-size: 18pt; font-weight: bold; color: #1a73e8; text-align: center; margin-bottom: 20pt; } .pagina { page-break-after: always; margin-bottom: 30pt; } .pagina:last-child { page-break-after: auto; } .tabela-nomes { width: 100%; border-collapse: collapse; } .tabela-nomes td { vertical-align: top; padding: 2pt 5pt; width: 25%; } .nome { margin: 3pt 0; line-height: 1.2; } .footer { text-align: center; font-style: italic; font-size: 9pt; color: #666666; margin-top: 30pt; }</style></head><body>`;
    for (var pagina = 0; pagina < totalPaginas; pagina++) {
      var startIndex = pagina * nomesPorPagina;
      var endIndex = Math.min(startIndex + nomesPorPagina, nomes.length);
      var nomesPagina = nomes.slice(startIndex, endIndex);
      html += '<div class="pagina"><div class="titulo">Pedidos de Cura - Shabat ' + shabatDate + '</div><table class="tabela-nomes"><tr>';
      for (var col = 0; col < numColunas; col++) {
        html += '<td>';
        for (var row = 0; row < nomesPorColuna; row++) {
          var nameIndex = (row * numColunas) + col;
          if (nameIndex < nomesPagina.length) {
            html += '<div class="nome">' + nomesPagina[nameIndex].nome + '</div>';
          }
        }
        html += '</td>';
      }
      html += '</tr></table>';
      if (pagina === totalPaginas - 1) {
        html += '<div class="footer">...e o Ponto de Estudos da Torah no Brasil e no Mundo.</div>';
      }
      html += '</div>';
    }
    html += '</body></html>';
    return html;
  }

  function generateProjectDoc() {
    showDevMessage('Buscando documentação do projeto...', 'info');
    google.script.run
      .withSuccessHandler(function(html) {
        if (!html) {
          showDevMessage('Erro: arquivo de documentação não encontrado no servidor.', 'error', 12000);
          return;
        }
        var blob = new Blob(['\ufeff', html], { type: 'application/msword' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'Documentacao_Pedidos_de_Cura_V1.4.doc';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showDevMessage('✅ Documentação Word baixada com sucesso!', 'success', 10000);
      })
      .withFailureHandler(function(error) {
        showDevMessage('Erro ao obter documentação: ' + error.message, 'error', 12000);
      })
      .getProjectDocumentationHtml();
  }
</script>
